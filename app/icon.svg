<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3620"/>
      <stop offset="1" stop-color="#22140b"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbefd9"/>
      <stop offset="1" stop-color="#e6caa0"/>
    </linearGradient>
    <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- end-grain growth rings -->
    <g fill="none" stroke="#f3d9b5" stroke-opacity=".07" stroke-width="6">
      <circle cx="470" cy="480" r="70"/><circle cx="470" cy="480" r="120"/><circle cx="470" cy="480" r="175"/>
      <circle cx="470" cy="480" r="235"/><circle cx="470" cy="480" r="300"/>
    </g>
    <!-- saddle stitching -->
    <rect x="40" y="40" width="432" height="432" rx="86" fill="none" stroke="#d9b483" stroke-opacity=".8"
      stroke-width="6" stroke-dasharray="22 14" stroke-linecap="round"/>
  </g>
  <!-- JT monogram -->
  <g fill="url(#ink)">
    <!-- J -->
    <rect x="104" y="140" width="136" height="44" rx="8"/>
    <path d="M178 184h46v140c0 50-36 80-84 80-18 0-32-3-45-9l11-40c9 5 20 8 32 8 25 0 40-15 40-42z"/>
    <!-- T -->
    <rect x="264" y="140" width="148" height="44" rx="8"/>
    <rect x="315" y="184" width="46" height="216" rx="4"/>
  </g>
</svg>
