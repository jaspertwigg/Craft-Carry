<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JT Creations</title>
  <meta name="description" content="JT Creations: a record of Wood Talking and Craft & Carry pieces.">
  <meta name="theme-color" content="#3d2415">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JT Creations">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button id="back" class="icon-btn" data-action="back" aria-label="Back" hidden>‹</button>
    <h1 id="title">JT Creations</h1>
    <button id="editBtn" class="icon-btn" data-action="edit" aria-label="Edit project" hidden><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z M14 6l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
    <button id="settingsBtn" class="icon-btn" data-action="settings" aria-label="Settings">⚙︎</button>
  </header>

  <main id="view"></main>

  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="photoInput" accept="image/*" multiple hidden>
  <input type="file" id="videoInput" accept="video/*" multiple hidden>
  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
