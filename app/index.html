<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Workshop Log</title>
  <meta name="description" content="A record of Wood Talking and Craft & Carry projects.">
  <meta name="theme-color" content="#4a2e1b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Workshop">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button id="back" class="icon-btn" data-action="back" aria-label="Back" hidden>‹</button>
    <h1 id="title">Workshop Log</h1>
    <button class="icon-btn" data-action="settings" aria-label="Settings">⚙︎</button>
  </header>

  <main id="view"></main>

  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="photoInput" accept="image/*" multiple hidden>
  <input type="file" id="videoInput" accept="video/*" multiple hidden>
  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
